# Compila el APK de Android en los servidores de GitHub.
# No hace falta tener instalado Node, Java ni Android Studio en la PC.
# Se dispara a mano desde la pestaña Actions y deja el .apk para descargar.
name: Generar APK de Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar dependencias
        run: npm install

      # La carpeta android/ no se versiona: Capacitor la genera limpia en cada build.
      - name: Generar el proyecto Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Compilar el APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: monedas-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
