# Genera el paquete FIRMADO para subir a Google Play (.aab) y un APK firmado para probar.
# Necesita dos secrets configurados en el repo (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64    contenido de upload.p12.base64
#   ANDROID_KEYSTORE_PASSWORD  la contraseña de esa clave
name: Release para Google Play

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión visible en la tienda (ej: 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dependencias
        run: npm install

      - name: Generar el proyecto Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Restaurar la clave de firma
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # Solo se imprimen longitudes, nunca el contenido de los secrets.
          echo "ANDROID_KEYSTORE_BASE64: ${#KEYSTORE_B64} caracteres (deberían ser 3584)"
          echo "ANDROID_KEYSTORE_PASSWORD: ${#PW} caracteres (deberían ser 32)"

          if [ -z "$KEYSTORE_B64" ]; then
            echo "ERROR: el secret ANDROID_KEYSTORE_BASE64 está vacío o no existe."
            echo "Revisá Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          if [ -z "$PW" ]; then
            echo "ERROR: falta el secret ANDROID_KEYSTORE_PASSWORD."
            exit 1
          fi

          # tr saca cualquier salto de línea o espacio que se haya colado al pegar
          if ! printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/upload.p12" 2>/dev/null; then
            echo "ERROR: el contenido del secret no es base64 válido."
            echo "Volvé a copiarlo entero desde monedas-claves\\upload.p12.base64."
            exit 1
          fi

          SIZE=$(stat -c%s "$RUNNER_TEMP/upload.p12")
          echo "clave restaurada: $SIZE bytes (deberían ser 2688)"
          # un PKCS12 válido arranca con los bytes 30 82
          MAGIC=$(od -An -tx1 -N2 "$RUNNER_TEMP/upload.p12" | tr -d ' ')
          if [ "$MAGIC" != "3082" ]; then
            echo "ERROR: el archivo restaurado no es un keystore PKCS12 (empieza con $MAGIC)."
            exit 1
          fi
          echo "OK: keystore válido."

      # versionCode tiene que subir en cada envío a Play: usamos el número de ejecución.
      - name: Compilar firmado
        working-directory: android
        env:
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.p12" \
            -Pandroid.injected.signing.store.password="$PW" \
            -Pandroid.injected.signing.key.alias=upload \
            -Pandroid.injected.signing.key.password="$PW" \
            -Pandroid.injected.version.code=${{ github.run_number }} \
            -Pandroid.injected.version.name=${{ inputs.version }}

      - name: Paquete para Play (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: monedas-play-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: APK firmado para probar en un celular
        uses: actions/upload-artifact@v4
        with:
          name: monedas-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
